name: Build ParForge Windows beta

on:
  push:
    branches: [main]
    paths:
      - 'parforge/app/**'
      - '.github/workflows/parforge-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: parforge/app
        run: npm install

      - name: Build portable Windows beta
        working-directory: parforge/app
        run: npm run dist

      - name: Calculate checksum
        shell: pwsh
        run: |
          $artifact = Get-ChildItem 'parforge/app/dist/ParForge-Beta-0.1.0-win-x64.exe' | Select-Object -First 1
          if (-not $artifact) { throw 'ParForge build artifact not found' }
          $hash = (Get-FileHash $artifact.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($artifact.Name)" | Set-Content 'parforge/app/dist/SHA256SUMS.txt'

      - name: Publish rolling beta release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifact = 'parforge/app/dist/ParForge-Beta-0.1.0-win-x64.exe'
          $checksum = 'parforge/app/dist/SHA256SUMS.txt'
          gh release view parforge-beta 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload parforge-beta $artifact $checksum --clobber
            gh release edit parforge-beta --title 'ParForge 0.1 public beta' --notes 'Modern automatic PAR2 repair + RAR extraction for Windows. Unsigned public beta; source files are kept by default.' --prerelease
          } else {
            gh release create parforge-beta $artifact $checksum --target $env:GITHUB_SHA --title 'ParForge 0.1 public beta' --notes 'Modern automatic PAR2 repair + RAR extraction for Windows. Unsigned public beta; source files are kept by default.' --prerelease
          }
